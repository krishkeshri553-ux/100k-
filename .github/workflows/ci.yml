name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Secret scan (no credentials committed)
        run: |
          if git grep -nE '(sk-ant-[a-zA-Z0-9_-]{20,}|eyJhbGciOi[A-Za-z0-9_-]{30,}|GOCSPX-[A-Za-z0-9_-]{10,}|1//0[A-Za-z0-9_-]{30,})' -- ':!*.test.ts' ; then
            echo "::error::Possible secret committed"; exit 1
          fi
